name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Enable auto-merge on the release pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          PRS_JSON: ${{ steps.release.outputs.prs }}
        run: |
          pr_number=$(node -e '
            const pr = process.env.PR_JSON ? JSON.parse(process.env.PR_JSON) : null;
            const prs = process.env.PRS_JSON ? JSON.parse(process.env.PRS_JSON) : [];
            const num = pr?.number ?? prs?.[0]?.number ?? "";
            process.stdout.write(String(num));
          ')
          if [ -z "$pr_number" ]; then
            pr_number=$(gh pr list --repo "$REPO" --base main --head "release-please--branches--main" --state open --json number --jq '.[0].number // empty')
          fi
          if [ -n "$pr_number" ]; then
            merge_state=$(gh pr view "$pr_number" --repo "$REPO" --json mergeStateStatus --jq '.mergeStateStatus // empty' 2>/dev/null || true)
            if [ "$merge_state" = "BEHIND" ]; then
              echo "Updating Release Please PR #$pr_number with main"
              gh pr update-branch "$pr_number" --repo "$REPO" || true
            fi
            echo "Enabling auto-merge on Release Please PR #$pr_number"
            gh pr merge "$pr_number" --auto --merge --repo "$REPO" || true
          else
            echo "No open release PR found."
          fi

      - name: Report release outcome
        if: always()
        env:
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$RELEASES_CREATED" = "true" ]; then
            echo "Release created: $TAG_NAME"
          else
            echo "No release created on this push (release PR updated or no releasable commits)."
          fi
