name: Playwright E2E Tests
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ./apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Allocate isolated test ports
        run: |
          node -e '
            const fs = require("node:fs");
            const net = require("node:net");
            const freePort = () => new Promise((resolve, reject) => {
              const s = net.createServer();
              s.listen(0, "127.0.0.1", () => {
                const { port } = s.address();
                s.close((err) => err ? reject(err) : resolve(port));
              });
            });
            (async () => {
              const apiPort = await freePort();
              let webPort = await freePort();
              while (webPort === apiPort) webPort = await freePort();
              fs.appendFileSync(process.env.GITHUB_ENV, [
                `PLAYWRIGHT_API_PORT=${apiPort}`,
                `PLAYWRIGHT_WEB_PORT=${webPort}`,
                `PLAYWRIGHT_BASE_URL=http://localhost:${webPort}`,
                `API_INTERNAL_URL=http://127.0.0.1:${apiPort}`,
              ].join("\n") + "\n");
            })();
          '

      - name: Build web
        run: pnpm --filter @moonwitness/api build && pnpm --filter @moonwitness/web build

      - name: Run Playwright tests
        working-directory: ./apps/web
        run: pnpm exec playwright test --config ../../playwright.config.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  allah-e2e-tests:
    name: A-L-L-A-H.COM E2E & Visual Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: ./apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build unified @moonwitness/web
        run: pnpm --filter @moonwitness/web build

      - name: Run A-L-L-A-H Playwright E2E
        working-directory: ./apps/web
        run: pnpm exec playwright test e2e/allah-homepage.spec.ts --config cross-world-playwright.config.ts

      - name: Upload A-L-L-A-H screenshots & Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allah-playwright-evidence
          path: apps/web/test-results/screenshots
          retention-days: 14
