name: Auto-promote dev to main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-promote-dev-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Create or auto-merge dev -> main promotion PR
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Open or update dev -> main promotion PR with auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin main dev
          ahead=$(git rev-list --count origin/main..origin/dev)
          if [ "$ahead" -eq 0 ]; then
            echo "dev is already even with main; nothing to promote."
            exit 0
          fi

          pr_number=$(gh pr list --repo "$REPO" --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$REPO" \
              --base main \
              --head dev \
              --title "chore(release): promote dev to main" \
              --body "Automated promotion from \`dev\` to \`main\` after passing CI checks ($ahead commit(s) ahead)."
            pr_number=$(gh pr list --repo "$REPO" --base main --head dev --state open --json number --jq '.[0].number // empty')
          fi

          if [ -n "$pr_number" ]; then
            echo "Enabling auto-merge on promotion PR #$pr_number"
            gh pr merge "$pr_number" --auto --merge --repo "$REPO" || true
          fi
