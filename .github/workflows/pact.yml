name: API Contract Testing (Pact)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pact-consumer:
    name: Pact Consumer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Pact consumer tests
        working-directory: ./apps/web
        run: pnpm test:pact
        env:
          PACT_DO_NOT_TRACK: "true"

      - name: Upload Pact contracts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pact-contracts
          path: apps/web/pacts/*.json
          if-no-files-found: error
          retention-days: 7

  pact-provider:
    name: Pact Provider Verification
    needs: pact-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Pact contracts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pact-contracts
          path: apps/web/pacts

      - name: Build API
        working-directory: ./apps/api
        run: pnpm build

      - name: Allocate provider port
        run: |
          node -e '
            const fs = require("node:fs");
            const net = require("node:net");
            const s = net.createServer();
            s.listen(0, "127.0.0.1", () => {
              const { port } = s.address();
              s.close(() => {
                fs.appendFileSync(process.env.GITHUB_ENV, `PACT_API_PORT=${port}\n`);
              });
            });
          '

      - name: Start seeded API
        working-directory: ./apps/api
        run: |
          nohup pnpm start > "$RUNNER_TEMP/moonwitness-api.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/moonwitness-api.pid"
        env:
          DATABASE_URL: ./pact-provider.db
          HOST: 127.0.0.1
          PORT: ${{ env.PACT_API_PORT }}
          SEED: "1"

      - name: Wait for API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:${PACT_API_PORT}/api/v1/readyz"; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/moonwitness-api.log"
          exit 1

      - name: Verify Pact contracts
        working-directory: ./apps/api
        run: pnpm verify:pact
        env:
          PACT_DO_NOT_TRACK: "true"
          PACT_PROVIDER_URL: http://127.0.0.1:${{ env.PACT_API_PORT }}

      - name: Stop seeded API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/moonwitness-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/moonwitness-api.pid")" >/dev/null 2>&1 || true
          fi
