name: Sync main back into dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Open or auto-merge main -> dev sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Sync main commits into dev via ephemeral PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "MoonWitness Bot"
          git config user.email "bot@moonwitness.local"
          git fetch origin main dev
          ahead=$(git rev-list --count origin/dev..origin/main)
          if [ "$ahead" -eq 0 ]; then
            echo "dev already includes all commits from main."
            exit 0
          fi

          git checkout -B chore/sync-main-into-dev origin/dev
          git merge --no-edit origin/main
          git push --force-with-lease origin chore/sync-main-into-dev

          pr_number=$(gh pr list --repo "$REPO" --base dev --head chore/sync-main-into-dev --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$REPO" \
              --base dev \
              --head chore/sync-main-into-dev \
              --title "chore(release): sync main into dev" \
              --body "Automated back-sync of release commits from \`main\` into \`dev\` ($ahead commit(s))."
            pr_number=$(gh pr list --repo "$REPO" --base dev --head chore/sync-main-into-dev --state open --json number --jq '.[0].number // empty')
          fi

          if [ -n "$pr_number" ]; then
            echo "Enabling auto-merge on sync PR #$pr_number"
            gh pr merge "$pr_number" --auto --merge --repo "$REPO" || true
          fi
